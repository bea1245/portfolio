    <div class="main-content">

      <!-- TOP BOX -->
      <div class="container">
    
        <div class="main-content-left">
          <div class="now-playing">
            <h2>Now Playing</h2>
            <div id="currentSong">No song selected</div>
            <img src="albumcover1.jpg" />
          </div>
        </div>
    
        <div class="main-content-right">
    
          <div class="playlist">
            <h3>Playlist</h3>
            <ul id="songTitle"></ul>
          </div>
    
          <div class="track-progress">
            <span id="currentTime"></span>

            <!--practice-->
            <div class="extras">
              <div class="volume-control">
                <label for="volumeSlider">Volume</label>
                <input type="range" id="volumeSlider" min="0" max="100" value="100" />
              </div>
            </div>
            
            <label for="progressBar" id="current-time-label">Current Time</label>
            <input type="range" id="progressBar" min="0" max="100" value="0" />
            <span id="totalTime">0:00</span>
          </div>
          <label for="audio" class="upload-label">Upload Audio</label>
          <input type="file" accept="audio/*" id="audio" /> 

          
    
        </div>
    
      </div>
    
      <div class="visualizer-section">
        <div class="visualizer-frame">
          <canvas id="canvas"></canvas>
        </div>
      </div>
      <!-- NEW BOTTOM BOX -->

            <i id="playBtn" class="fa-solid fa-play"></i>
            <i id="pauseBtn" class="fa-solid fa-pause"></i>
            <i id="nextBtn" class="fa-solid fa-forward-step"></i>
          </div>
      </div>
